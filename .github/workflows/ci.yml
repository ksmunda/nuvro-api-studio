name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Runner diagnostics
        run: |
          uname -a
          node --version
          npm --version
          corepack --version || true
          which node
          which npm
          which pnpm || true
          env | sort | grep -E 'NODE|PNPM|COREPACK' || true

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@10.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @nuvro/database db:generate

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

  test:
    name: Unit & E2E Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@10.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @nuvro/database db:generate

      - name: Install Playwright browsers
        run: pnpm --filter @nuvro/e2e exec playwright install --with-deps

      - name: Stop pre-installed Postgres
        run: |
          sudo systemctl stop postgresql || true
          sudo service postgresql stop || true

      - name: Start Postgres
        run: |
          docker compose up -d postgres
          echo "Waiting for Postgres to be ready..."
          until docker exec nuvro_postgres pg_isready -U nuvro -d nuvro_dev; do
            sleep 1
          done
          echo "Postgres is ready!"

      - name: Run Database Migrations
        run: pnpm --filter @nuvro/database db:migrate:deploy
        env:
          DATABASE_URL: postgresql://nuvro:nuvro_dev_password@127.0.0.1:5432/nuvro_dev

      - name: Verify Database Schema
        run: |
          echo "Verifying database schema initialization..."
          docker exec nuvro_postgres psql -U nuvro -d nuvro_dev -c '\dt public.users' | grep -i users
        env:
          DATABASE_URL: postgresql://nuvro:nuvro_dev_password@127.0.0.1:5432/nuvro_dev

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm --filter @nuvro/e2e test
        env:
          DATABASE_URL: postgresql://nuvro:nuvro_dev_password@127.0.0.1:5432/nuvro_dev
          DEBUG: pw:webserver

      - name: Debug Output Locations on Failure
        if: failure()
        run: |
          echo "=== Root Files ==="
          ls -la
          echo "=== E2E Files ==="
          ls -la tests/e2e
          echo "=== Find playwright results ==="
          find . -maxdepth 4 -name "*report*" -o -name "*result*" -o -name "*screenshot*" || true

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 5

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@10.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @nuvro/database db:generate

      - name: Build all packages
        run: pnpm build
